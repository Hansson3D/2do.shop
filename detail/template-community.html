<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community-Tipps Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a; --surface: #141414; --surface-hover: #1e1e1e;
    --text: #e5e5e5; --text-muted: #888; --accent: #ff5e00; --accent-2: #ff8c42;
    --border: #2a2a2a; --radius: 12px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .community-tips { margin-top: 3rem; padding-top: 2rem; border-top: 2px solid var(--border); }
  .community-tips h3 { font-size: 1.5rem; margin-bottom: 1rem; color: var(--accent-2); }
  .tips-intro { color: var(--text-muted); margin-bottom: 1.5rem; }
  
  /* Filter Tabs */
  .filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .filter-tab {
    padding: 0.5rem 1rem; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); cursor: pointer; font-size: 0.85rem;
    transition: all 0.2s;
  }
  .filter-tab:hover { border-color: var(--accent); }
  .filter-tab.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  
  /* Produkt-Karten */
  .products-section { display: none; }
  .products-section.active { display: block; }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
  .product-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.2rem; transition: all 0.2s;
  }
  .product-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .product-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem; gap: 0.5rem; }
  .product-name { font-size: 0.95rem; font-weight: 600; line-height: 1.3; flex: 1; }
  .product-badge {
    background: var(--accent); color: #000; padding: 0.2rem 0.5rem; border-radius: 4px;
    font-size: 0.75rem; font-weight: 700; white-space: nowrap; flex-shrink: 0;
  }
  .product-desc { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.8rem; line-height: 1.4; }
  .product-meta { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
  .product-price { font-size: 1rem; font-weight: 700; color: var(--accent); }
  .product-rating { font-size: 0.85rem; color: var(--text-muted); }
  .product-btn {
    display: inline-block; background: var(--accent); color: #000; padding: 0.5rem 1rem;
    border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 0.85rem;
  }
  .product-btn:hover { background: var(--accent-2); color: #000; }
  
  footer { padding: 3rem 2rem; text-align: center; border-top: 1px solid var(--border); color: var(--text-muted); margin-top: 3rem; }
</style>
</head>
<body>
  <div class="container">
  <div class="community-tips">
    <h3>💡 Community-Tipps & Erfahrungsberichte</h3>
    <p class="tips-intro">Diese Produkte wurden in Foren und Erfahrungsberichten empfohlen — keine Standard-Starterkits.</p>
    
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">Alle</button>
      <button class="filter-tab" data-filter="guenstig">💸 Günstig</button>
      <button class="filter-tab" data-filter="preis-leistung">⚖️ Preis/Leistung</button>
      <button class="filter-tab" data-filter="marke">⭐ Markenprodukt</button>
    </div>
    
    <div class="products-section active" data-category="all">
      <div class="products-grid">
        <div class="product-card">
          <div class="product-header">
            <div class="product-name">Produktname hier</div>
            <span class="product-badge">Preiskategorie</span>
          </div>
          <p class="product-desc">Kurze Beschreibung des Produkts.</p>
          <div class="product-meta">
            <span class="product-price">29,99 €</span>
            <span class="product-rating">⭐ 4.5</span>
            <a href="https://www.amazon.de/dp/ASIN?tag=shops2go-21" class="product-btn" target="_blank">Bei Amazon ansehen →</a>
          </div>
        </div>
      </div>
    </div>
    
    <div class="products-section active" data-category="guenstig">
      <div class="products-grid"></div>
    </div>
    
    <div class="products-section active" data-category="preis-leistung">
      <div class="products-grid"></div>
    </div>
    
    <div class="products-section active" data-category="marke">
      <div class="products-grid"></div>
    </div>
  </div>
  </div>
  
  <footer>
    <p>© 2025 2do.shop</p>
  </footer>
  
  <script>
    // Filter tabs for community tips
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const filter = tab.dataset.filter;
        document.querySelectorAll('.products-section').forEach(section => {
          if (filter === 'all') {
            section.classList.add('active');
          } else {
            section.classList.toggle('active', section.dataset.category === filter);
          }
        });
      });
    });
  </script>
</body>
</html>
